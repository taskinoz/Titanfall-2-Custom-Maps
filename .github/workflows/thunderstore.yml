name: Publish maps to Thunderstore

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      selection:
        description: 'current, runtime mod name (e.g. MRVN.MinecraftUma), or release tag'
        default: current
        required: true
      publish:
        description: 'Publish to Thunderstore (false builds downloadable packages only)'
        type: boolean
        default: false
  pull_request:
    paths: ['thunderstore/**', 'tools/**', 'maps/*/mod/*/mod.json', '.github/workflows/thunderstore.yml']

permissions:
  contents: read

concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_thunderstore_ci
        working-directory: tools

  release:
    needs: test
    if: github.repository == 'taskinoz/Titanfall-2-Custom-Maps' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHOULD_PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      # The catalog and publishing code always come from main, not the release tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            thunderstore
            tools
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check publishing configuration
        if: env.SHOULD_PUBLISH == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.TS_KEY }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add the taskinoz Thunderstore service-account token as repository secret TS_KEY.'
            exit 1
          fi
      - name: Download, verify and repackage catalogued releases
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.selection }}
        run: python tools/thunderstore_ci.py --select "$SELECTION" --output "$RUNNER_TEMP/thunderstore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.count != '0'
        with:
          name: thunderstore-packages-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/thunderstore/*/*.zip
            ${{ runner.temp }}/thunderstore/receipts.json
            !${{ runner.temp }}/thunderstore/downloads/**
          compression-level: 0
          retention-days: 7
      - name: Publish
        if: env.SHOULD_PUBLISH == 'true' && steps.prepare.outputs.count != '0'
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TS_KEY }}
        run: python tools/thunderstore_ci.py --output "$RUNNER_TEMP/thunderstore" --publish
